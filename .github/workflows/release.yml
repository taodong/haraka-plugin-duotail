name: "Release"
on:
    push:
        tags:
            - "v*"

permissions:
    contents: read
    id-token: write # required for npm trusted publishing (OIDC)

jobs:
    npm-publish:
        name: npm-publish
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                node-version: 24
                registry-url: "https://registry.npmjs.org"

            # Trusted publishing requires npm >= 11.5.1. Pinned to a major
            # rather than @latest so a new major cannot change install
            # behaviour underneath us (npm 12 blocks dependency lifecycle
            # scripts by default; see "allowScripts" in package.json).
            - name: Update npm
              run: npm install -g npm@12

            - name: Install Node.js dependencies
              run: npm ci

            - name: Run tests
              run: npm test

            - name: Publish to npm
              run: npm publish --access public
